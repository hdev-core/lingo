name: Daily Puzzle Reveal
permissions:
  contents: read
on:
  # DISABLED 2026-09-03 — the frontend still plays a hardcoded local word and
  # never fetches puzzles from the API, so scheduled runs would broadcast real
  # commits to Hive mainnet for puzzles no player can see, consuming one answer
  # from the bank per day. Re-enable by uncommenting the schedule block once the
  # gameplay is wired to the backend. workflow_dispatch is left active so both
  # jobs can still be run by hand for testing.
  # schedule:
  # # Run after midnight UTC. The script selects the oldest eligible prior
  # # live puzzle from database state, not from the runner's wall-clock date.
  # - cron: "5 0 * * *"

  workflow_dispatch:

jobs:
  reveal:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run daily reveal
        run: npm run puzzle:reveal
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          HIVE_NETWORK: mainnet
          HIVE_APP_ACCOUNT: ${{ secrets.HIVE_APP_ACCOUNT }}
          HIVE_APP_POSTING_KEY: ${{ secrets.HIVE_APP_POSTING_KEY }}
