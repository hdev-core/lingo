name: PR CI (server)

"on":
  pull_request:
    paths:
      - 'server/**'

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Confirm valid guess list is deployed
        run: test -s data/valid-guesses.txt

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test