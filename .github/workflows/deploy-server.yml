name: Deploy server to Hetzner

permissions:
  contents: read

"on":
  push:
    branches:
      - main
    paths:
      - 'server/**'

  workflow_dispatch:

# Never allow two production deployments to modify the server at the
# same time. Do not cancel a deployment that is already in progress.
concurrency:
  group: lingo-server-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262

        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_SSH_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}

          # Pin the SSH host identity so the deploy key is never sent
          # to an unexpected host.
          fingerprint: SHA256:CRHSMARNgnBQ7KUaDz+Tl9C/aFOSmQeI5GceF17mq2s

          script: |
            set -e

            cd ${{ secrets.HETZNER_LINGO_PATH }}/server

            echo "Updating server from main..."
            git pull --ff-only origin main

            echo "Checking required valid-guesses data..."
            if [ ! -s data/valid-guesses.txt ]; then
              echo "ERROR: data/valid-guesses.txt is missing or empty"
              exit 1
            fi

            echo "Installing production dependencies..."
            npm ci --omit=dev

            mkdir -p logs

            echo "Restarting API..."
            npx pm2 restart ecosystem.config.js --update-env || \
              npx pm2 start ecosystem.config.js

            npx pm2 save

            echo "Waiting for API health check..."

            for attempt in 1 2 3 4 5 6; do
              if curl --fail --silent --show-error \
                http://127.0.0.1:3001/health; then

                echo
                echo "Health check passed."
                exit 0
              fi

              echo "Health check attempt ${attempt}/6 failed."

              if [ "$attempt" -lt 6 ]; then
                sleep 5
              fi
            done

            echo "ERROR: API did not become healthy."

            npx pm2 status || true
            npx pm2 logs lingo-server --lines 50 --nostream || true

            exit 1