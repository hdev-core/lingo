name: Deploy server to Hetzner
permissions:
  contents: read
"on":
  push:
    branches: [main]
    paths:
      - 'server/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10 # fail fast rather than hang, same reasoning as the frontend deploy workflows
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_SSH_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            cd ${{ secrets.HETZNER_LINGO_PATH }}/server
            git pull origin main
            npm ci --omit=dev
            npx pm2 restart ecosystem.config.js --update-env || npx pm2 start ecosystem.config.js
            npx pm2 save