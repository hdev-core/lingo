name: Mainnet Commit/Reveal Smoke Test
permissions:
  contents: read
on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run mainnet commit/reveal smoke test
        run: node scripts/mainnet_smoke_test.js
        env:
          HIVE_NETWORK: mainnet
          HIVE_APP_ACCOUNT: ${{ secrets.HIVE_APP_ACCOUNT }}
          HIVE_APP_POSTING_KEY: ${{ secrets.HIVE_APP_POSTING_KEY }}
          HIVE_ENGINE_NODE: https://api.hive-engine.com/rpc
          LINGO_TOKEN_SYMBOL: LINGO